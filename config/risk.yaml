# Risk Configuration
# IMPORTANT: Default is READ-ONLY + PAPER TRADING

# =============================================================================
# TRADING MODE (CRITICAL)
# =============================================================================
live_trading_enabled: false
allow_auto_execution: false
paper_trading_enabled: true

# =============================================================================
# ACCOUNT LIMITS
# =============================================================================
max_account_capital_usd: 100.0
max_position_pct: 0.01        # 1% per trade
max_market_exposure_pct: 0.03  # 3% per market
max_strategy_exposure_pct: 0.08  # 8% per strategy

# =============================================================================
# LOSS LIMITS
# =============================================================================
daily_max_loss_pct: 0.03      # 3% daily max loss
weekly_max_loss_pct: 0.08     # 8% weekly max loss
max_consecutive_losses: 3

# =============================================================================
# MARKET FILTERS
# =============================================================================
min_total_volume_usd: 100000
min_24h_volume_usd: 50000
max_spread_pct: 0.05          # 5% max spread
min_depth_usd: 20
max_price_drift_pct: 0.02     # 2% max price drift

# =============================================================================
# ORDER SETTINGS
# =============================================================================
order_timeout_seconds: 20
default_order_size_usd: 1.0
slippage_assumption_pct: 0.01  # 1% slippage assumption for paper trading

# =============================================================================
# SCORING WEIGHTS
# =============================================================================
scoring_weights:
  microstructure: 0.30
  liquidity: 0.20
  event: 0.20
  wallet: 0.15
  lifecycle: 0.15

# =============================================================================
# DECISION THRESHOLDS
# =============================================================================
thresholds:
  ignore: 70          # score < 70: ignore
  log_only: 80        # 70 <= score < 80: log only
  alert: 90           # 80 <= score < 90: alert + paper trade
  manual_review: 95   # 90 <= score < 95: alert + paper trade + manual review
  # score >= 95: paper trade by default; live only if explicitly enabled

# =============================================================================
# FORBIDDEN CATEGORIES (Auto-execution forbidden)
# =============================================================================
forbidden_auto_categories:
  - politics
  - war_geopolitics
  - legal
  - celebrity
  - subjective

# =============================================================================
# CIRCUIT BREAKER
# =============================================================================
circuit_breaker:
  max_api_failures: 5
  max_ws_disconnects: 3
  stale_data_threshold_seconds: 60

# =============================================================================
# LIFECYCLE ENGINE
# =============================================================================
lifecycle:
  # Phase thresholds (time remaining percentage)
  early_threshold: 0.90      # > 90% remaining = EARLY phase
  late_threshold: 0.20       # < 20% remaining = LATE phase
  closing_threshold: 0.05    # < 5% remaining = CLOSING phase
  close_time_risk_threshold: 0.70

  # Ambiguity detection keywords
  ambiguity_keywords:
    - might
    - maybe
    - possibly
    - subjective
    - opinion
    - unclear
    - disputed
    - tbd
    - unknown
    - pending
    - to be announced

  # Penalty multipliers for lifecycle_score
  ambiguity_penalty_multiplier: 40
  resolution_penalty_multiplier: 25
  close_time_penalty_multiplier: 20
