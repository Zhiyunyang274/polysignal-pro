[project]
name = "polysignal-pro"
version = "0.1.0"
description = "Polymarket prediction market intelligence system - research-first, paper trading, risk-controlled"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PolySignal Pro Team"}
]
keywords = ["polymarket", "prediction-market", "trading", "risk-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx[socks]>=0.25",
    "websockets>=12.0",
    "aiosqlite>=0.19",
    "structlog>=23.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "black>=23.0",
    "mypy>=1.0",
    "pandas>=2.0",
]
telegram = [
    "python-telegram-bot>=20.0",
]
dashboard = [
    "pandas>=2.0",
    "streamlit>=1.28",
    "plotly>=5.0",
]
llm = [
    "openai>=1.0",
]

[project.scripts]
polysignal = "polysignal.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polysignal"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501 (line-too-long) is accepted style debt as of 2026-09-12 (Iteration 009):
# 800+ legacy lines exceed 100 chars with zero semantic impact; per-line manual
# rewrapping would create high-churn, regression-prone diffs with no functional
# gain (no style CI gate exists). Semantic findings remain enforced.
ignore = [
    "E501",
    # UP042 (Iteration 013): only the five enums whose custom __str__ returns
    # self.value were migrated to StrEnum (OrderSide/OrderStatus/RiskAction/
    # SignalSide/SuggestedMode) — behavior identical. The remaining 25 str-Enums
    # have no custom __str__ on Python 3.11, so str(member) currently yields
    # 'Class.MEMBER'; migrating would change log/f-string output. Intentionally kept.
    "UP042",
    # SIM102 (Iteration 015): collapsing nested ifs is style-only; 20 manual
    # control-flow rewrites would be high-churn with zero functional gain.
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
# SIM115 (Iteration 015): test files wire long-lived file handles into runner
# internals or do one-shot opens of throwaway fixtures; no functional impact.
# E402 (test_dashboard): mock-before-import is required to stub Streamlit.
# SIM117 (provider tests): nested with (patch + pytest.raises) reads clearer.
# SIM222 (mock provider test): deliberately weakened hash-output assertion.
"tests/*" = ["SIM115", "E402", "SIM117", "SIM222"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
# Runtime floor is 3.11 (ADR-026 supersedes ADR-012); annotations in class
# bodies (e.g. `RiskDecision | None`) are evaluated eagerly and require 3.10+.
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
